<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2530">
<title>I-40 · California to North Carolina</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/leaflet.css">
<style>
  @font-face { font-family:"Overpass"; src:url("fonts/overpass-400.woff2") format("woff2"); font-weight:400; font-display:swap; }
  @font-face { font-family:"Overpass"; src:url("fonts/overpass-600.woff2") format("woff2"); font-weight:600; font-display:swap; }
  @font-face { font-family:"Overpass"; src:url("fonts/overpass-700.woff2") format("woff2"); font-weight:700; font-display:swap; }

  :root{
    --asphalt:#1C2530; --asphalt-2:#141b23;
    --sign:#F5F3EC; --muted:#9aa7b4;
    --green:#1E7A46; --green-lite:#37a967;
    --blue:#14396E; --red:#C1272D; --amber:#F2A900;
    --font:"Overpass", Arial, "Helvetica Neue", sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:var(--font);
    background:var(--asphalt-2); color:var(--sign);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  #map{ position:fixed; inset:0; background:#2b3641; }

  /* Leaflet chrome tuned to the palette */
  .leaflet-control-zoom a{ background:var(--asphalt); color:var(--sign); border:none; }
  .leaflet-control-zoom a:hover{ background:#26313d; }
  .leaflet-control-attribution{ background:rgba(20,27,35,.7); color:var(--muted); }
  .leaflet-control-attribution a{ color:var(--green-lite); }
  .leaflet-popup-content-wrapper{ background:var(--asphalt); color:var(--sign);
    border-radius:12px; font-family:var(--font); }
  .leaflet-popup-tip{ background:var(--asphalt); }

  /* map markers */
  .pin{ width:16px; height:16px; border-radius:50%; background:var(--green);
    border:3px solid var(--sign); box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .pin--fav{ background:var(--amber); border-color:#fff; }
  .pin--custom{ background:var(--amber); border-radius:3px; transform:rotate(45deg); }
  .me{ width:18px; height:18px; border-radius:50%; background:var(--amber);
    border:3px solid #fff; box-shadow:0 0 0 6px rgba(242,169,0,.30); }
  @media (prefers-reduced-motion: no-preference){
    .me{ animation:ping 1.8s ease-out infinite; }
    @keyframes ping{ 0%{ box-shadow:0 0 0 4px rgba(242,169,0,.45);} 70%{ box-shadow:0 0 0 16px rgba(242,169,0,0);} 100%{ box-shadow:0 0 0 4px rgba(242,169,0,0);} }
  }

  /* locate target button */
  #locate{ position:fixed; right:14px; bottom:calc(var(--sheet-h,190px) + 16px);
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:var(--amber); color:#3a2a00; font-size:26px; line-height:1;
    box-shadow:0 4px 14px rgba(0,0,0,.45); z-index:600; transition:bottom .3s ease; }
  #locate.locate--active{ box-shadow:0 0 0 4px rgba(242,169,0,.35), 0 4px 14px rgba(0,0,0,.45); }

  /* hint bar shown while pinning a stop */
  #hint{ position:fixed; top:12px; left:50%; transform:translateX(-50%);
    background:var(--amber); color:#3a2a00; font-weight:600; padding:9px 16px;
    border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,.4); z-index:700;
    opacity:0; pointer-events:none; transition:opacity .2s; }
  #hint.hint--on{ opacity:1; }

  /* bottom sheet */
  #sheet{ position:fixed; left:0; right:0; bottom:0; z-index:650;
    background:var(--asphalt); border-radius:20px 20px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.5);
    padding:0 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; }
  #handle{ align-self:center; width:44px; height:5px; border-radius:3px;
    background:#3b4653; margin:9px 0 6px; border:none; cursor:pointer; }

  /* status: shield + next stop */
  .status{ display:flex; align-items:center; gap:14px; }
  .shield{ flex:0 0 auto; width:58px; height:60px; border-radius:10px;
    background:var(--blue); border:2px solid var(--sign);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:4px; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .shield__top{ font-size:8px; font-weight:600; letter-spacing:.5px; color:var(--sign);
    background:var(--red); width:100%; text-align:center; border-radius:2px 2px 0 0;
    margin-top:-4px; padding:2px 0; }
  .shield__no{ font-size:30px; font-weight:700; color:var(--sign); margin-top:2px; }
  .status__text{ min-width:0; }
  .status__kicker{ font-size:12px; font-weight:600; color:var(--amber); margin:0 0 1px; }
  .status__name{ font-size:1.5rem; font-weight:700; line-height:1.1; margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status__dist{ font-size:.95rem; color:var(--muted); margin:2px 0 0; }

  /* highway progress strip */
  .progRow{ display:flex; align-items:center; gap:10px; margin:16px 0 4px; }
  .progEnd{ font-size:13px; font-weight:700; color:var(--muted); width:22px; text-align:center; }
  .prog{ position:relative; flex:1; height:14px; border-radius:7px;
    background:var(--asphalt-2);
    background-image:repeating-linear-gradient(90deg, var(--amber) 0 12px, transparent 12px 26px);
    background-position:center; background-size:26px 3px; background-repeat:repeat-x; }
  .progFill{ position:absolute; left:0; top:0; bottom:0; width:0;
    background:var(--green); border-radius:7px 0 0 7px; transition:width .6s ease; }
  .progCar{ position:absolute; top:50%; left:0; width:14px; height:14px;
    border-radius:50%; background:var(--amber); border:2px solid #fff;
    transform:translate(-50%,-50%); transition:left .6s ease; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .progLabel{ text-align:center; font-size:13px; font-weight:600; color:var(--muted); margin:2px 0 0; }

  /* tab bar */
  .tabbar{ display:flex; gap:8px; margin:14px 0 0; }
  .tab{ flex:1; padding:11px 0; border:none; border-radius:10px; cursor:pointer;
    background:var(--asphalt-2); color:var(--sign); font-family:var(--font);
    font-size:15px; font-weight:600; }
  .tab--on{ background:var(--green); }
  .addStop{ flex:0 0 auto; padding:11px 14px; border:none; border-radius:10px; cursor:pointer;
    background:transparent; color:var(--amber); border:1.5px solid var(--amber);
    font-family:var(--font); font-size:15px; font-weight:600; }
  .addStop--on{ background:var(--amber); color:#3a2a00; }

  /* expandable list area */
  .panels{ max-height:0; overflow-y:auto; transition:max-height .3s ease; margin-top:0; }
  #sheet.sheet--open .panels{ max-height:52vh; margin-top:12px; }
  .panel{ display:none; }
  .panel--on{ display:block; }
  .row{ display:flex; align-items:stretch; gap:8px; padding:10px 0;
    border-bottom:1px solid #26313d; }
  .row__go{ flex:1; text-align:left; background:none; border:none; cursor:pointer;
    color:var(--sign); font-family:var(--font); padding:0; }
  .row__name{ display:block; font-size:16px; font-weight:600; }
  .row__meta{ display:block; font-size:13px; color:var(--muted); margin-top:2px; line-height:1.3; }
  .row__act{ flex:0 0 auto; width:44px; border:none; border-radius:8px; cursor:pointer;
    background:var(--asphalt-2); color:var(--amber); font-size:20px; }
  .empty{ color:var(--muted); font-size:14px; line-height:1.5; padding:10px 2px; }
</style>
</head>
<body>
  <div id="map"></div>
  <button id="locate" aria-label="Find where I am on the route">◎</button>
  <div id="hint">Tap the map to pin this stop</div>

  <section id="sheet" aria-label="Trip status">
    <button id="handle" aria-label="Expand or collapse the panel"></button>

    <div class="status">
      <div class="shield" aria-hidden="true">
        <span class="shield__top">INTERSTATE</span>
        <span class="shield__no">40</span>
      </div>
      <div class="status__text">
        <p class="status__kicker" id="statusKicker">Next stop</p>
        <h1 class="status__name" id="nextName">Tap the target to begin</h1>
        <p class="status__dist" id="nextDist">Shows where you are along the route</p>
      </div>
    </div>

    <div class="progRow">
      <span class="progEnd">CA</span>
      <div class="prog"><div class="progFill" id="progFill"></div><div class="progCar" id="progCar"></div></div>
      <span class="progEnd">NC</span>
    </div>
    <p class="progLabel" id="progLabel">&nbsp;</p>

    <div class="tabbar">
      <button class="tab tab--on" data-panel="stops">Stops</button>
      <button class="tab" data-panel="favs">Favorites</button>
      <button class="addStop" id="addStop">＋ Add a stop</button>
    </div>

    <div class="panels">
      <div class="panel panel--on" id="panel-stops"></div>
      <div class="panel" id="panel-favs"></div>
    </div>
  </section>

  <script src="js/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
